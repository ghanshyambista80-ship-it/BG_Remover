<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaazi AI - Free for Students</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1c1c1a;--muted:#77776f;--accent:#1f6f5c;--border:#e3e3de}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--text:#ecece8;--muted:#9a9a92;--accent:#2b7f6a;--border:#333330}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;display:flex;flex-direction:column}
header{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:17px;margin:0}
select,header button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px}
#setup{max-width:560px;margin:auto;padding:24px;text-align:center;line-height:1.6}
#setup p{color:var(--muted);font-size:14px}
#load{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:16px;cursor:pointer;margin-top:10px}
#bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:16px;display:none}
#fill{height:100%;width:0;background:var(--accent);transition:width .2s}
#status{font-size:13px;color:var(--muted);margin-top:8px}
#app{display:none;flex:1;flex-direction:column;min-height:0}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:760px;width:100%;margin:0 auto}
.m{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.a{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.in{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);max-width:760px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;max-height:120px}
#send{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 18px;font-size:15px;cursor:pointer}
#send:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <h1>Kaazi AI</h1>
  <div><button id="clear" style="display:none">New chat</button></div>
</header>

<div id="setup">
  <h2>Free AI for students</h2>
  <p>This AI runs on your own phone or computer. No limit, no cost, no account. The first time it downloads the AI model once (a large file), then it works quickly next time.</p>
  <p>यो AI तपाईंको आफ्नै फोन/कम्प्युटरमा चल्छ। कुनै सीमा छैन, निःशुल्क।</p>
  <select id="model">
    <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Fast and small (about 0.7 GB)</option>
    <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Better answers (about 1 GB)</option>
    <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Best quality (about 2 GB, needs a strong device)</option>
  </select><br>
  <button id="load">Start AI</button>
  <div id="bar"><div id="fill"></div></div>
  <div id="status"></div>
</div>

<div id="app">
  <div id="log"></div>
  <div class="in">
    <textarea id="in" rows="1" placeholder="Ask anything..."></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const SYS = "You are Kaazi AI, a friendly tutor and general knowledge assistant for students. Answer clearly and briefly. Reply in the same language the student uses. If you are not sure about a fact, say so instead of guessing. You have no internet access, so say so for questions about current news, prices or events.";

const $ = id => document.getElementById(id);
let engine = null, busy = false, history = [];

$("load").onclick = async () => {
  if (!navigator.gpu) {
    $("status").textContent = "This browser does not support WebGPU. Use the latest Chrome or Edge on a recent phone or computer.";
    return;
  }
  $("load").disabled = true; $("model").disabled = true; $("bar").style.display = "block";
  try {
    engine = await webllm.CreateMLCEngine($("model").value, {
      initProgressCallback: p => {
        $("fill").style.width = Math.round((p.progress || 0) * 100) + "%";
        $("status").textContent = p.text;
      }
    });
    $("setup").style.display = "none";
    $("app").style.display = "flex";
    $("clear").style.display = "inline-block";
    addMsg("assistant", "Hi! Ask me anything. / नमस्ते! जे पनि सोध्नुहोस्।");
  } catch (e) {
    $("status").textContent = "Could not load the AI: " + e.message + ". Try the smaller model.";
    $("load").disabled = false; $("model").disabled = false;
  }
};

function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "m " + (role === "user" ? "u" : "a");
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

async function send() {
  const text = $("in").value.trim();
  if (!text || busy || !engine) return;
  busy = true; $("send").disabled = true;
  $("in").value = ""; $("in").style.height = "auto";
  addMsg("user", text);
  history.push({ role: "user", content: text });
  const bubble = addMsg("assistant", "...");
  try {
    const msgs = [{ role: "system", content: SYS }].concat(history.slice(-12));
    const stream = await engine.chat.completions.create({ messages: msgs, stream: true, temperature: 0.6, max_tokens: 800 });
    let out = "";
    for await (const chunk of stream) {
      out += (chunk.choices[0] && chunk.choices[0].delta.content) || "";
      bubble.textContent = out || "...";
      $("log").scrollTop = $("log").scrollHeight;
    }
    history.push({ role: "assistant", content: out });
  } catch (e) {
    history.pop();
    bubble.textContent = "Error: " + e.message;
  }
  busy = false; $("send").disabled = false; $("in").focus();
}

$("send").onclick = send;
$("in").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("in").addEventListener("input", () => { $("in").style.height = "auto"; $("in").style.height = Math.min($("in").scrollHeight, 120) + "px"; });
$("clear").onclick = () => { history = []; $("log").innerHTML = ""; addMsg("assistant", "New chat. Ask me anything."); };
</script>
</body>
</html>
